<script>
const state={token:'',profile:null,bootstrap:null,dashboard:null,currentDoc:null,docs:[],training:null,trainingView:'documents',trainingDetail:'',admin:null,adminTab:'',editorDirty:false,editorTracking:false};
const POP_SECTION_HELP={
  'Objetivo':'Informe para que serve este procedimento e qual resultado ele pretende alcançar.',
  'Aplicação':'Informe onde, quando e para quais setores, processos ou atividades este procedimento se aplica.',
  'Definições':'Explique termos, siglas e conceitos necessários para compreender e executar o procedimento.',
  'Responsabilidades':'Defina quem executa, acompanha, verifica e aprova cada atividade.',
  'Procedimento':'Descreva o passo a passo na ordem de execução, incluindo cuidados e critérios importantes.',
  'Registros e evidências':'Indique os registros gerados e inclua aqui imagens, tabelas, formulários e anexos relacionados.',
  'Referências':'Liste documentos, normas, legislações e materiais consultados.'
};
const IT_SECTION_HELP={
  'Objetivo':'Informe a finalidade desta instrução e o resultado esperado ao executar a atividade.',
  'Materiais e EPI':'Liste materiais, ferramentas, equipamentos e EPIs necessários para realizar a atividade com segurança.',
  'Condições iniciais':'Descreva as verificações, preparações e condições que devem ser atendidas antes de iniciar.',
  'Instruções passo a passo':'Detalhe cada etapa na ordem de execução e informe, junto a cada passo, seus pontos de controle e critérios de aceitação.',
  'Riscos e cuidados':'Informe os riscos da atividade, as medidas preventivas e os cuidados necessários durante a execução.',
  'Registros e evidências':'Indique os registros gerados e inclua aqui imagens, tabelas, formulários, evidências e anexos relacionados.'
};
const POL_SECTION_HELP={
  'Objetivo e compromisso':'Declare a finalidade da política e o compromisso assumido pela organização.',
  'Abrangência':'Informe a quais unidades, setores, processos, pessoas e partes interessadas esta política se aplica.',
  'Princípios':'Apresente os valores e fundamentos que orientam as decisões relacionadas a esta política.',
  'Diretrizes':'Descreva as regras gerais e linhas de atuação que devem ser seguidas.',
  'Responsabilidades':'Defina quem promove, aplica, acompanha e assegura o cumprimento desta política.',
  'Comunicação e revisão':'Informe como a política será divulgada, mantida acessível e revisada quando necessário.',
  'Referências':'Liste normas, legislações, documentos internos e demais fontes relacionadas.'
};
const $=id=>document.getElementById(id), esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function gas(name,...args){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r.data):reject(new Error(r&&r.error?r.error.message:'Falha no servidor.'))).withFailureHandler(e=>reject(new Error(e.message||e)));runner[name](...args);});}
function busy(on){$('busy').classList.toggle('hidden',!on)}function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function fail(e,target){console.error(e);if(target){target.textContent=e.message;target.classList.remove('hidden')}else toast(e.message||e)}
function editorVisible(){return !$('view-editor')?.classList.contains('hidden')}
function confirmEditorExit(){if(!editorVisible()||!state.editorDirty)return true;if(!window.confirm('Existem alterações não salvas. Deseja sair sem salvar?'))return false;state.editorDirty=false;state.editorTracking=false;return true}
function showView(name){if(name!=='editor'&&!confirmEditorExit())return false;document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));const el=$('view-'+name);if(el)el.classList.remove('hidden');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('hidden',x.dataset.view===name||(['detail','editor'].includes(name)&&x.dataset.view==='documents')));if(name==='dashboard')loadDashboard();if(name==='documents')loadDocuments();if(name==='training'){state.trainingDetail='';loadTraining()}if(name==='users'){const manager=state.profile.roles.includes('Manager'),visitor=state.profile.roles.includes('Visitante'),initial=manager?'':visitor?'users':'people';state.adminTab=initial;document.querySelectorAll('[data-admin-tab]').forEach(x=>{const tab=x.dataset.adminTab,visible=manager||(visitor?tab==='users':tab==='people');x.classList.toggle('hidden',!visible);x.classList.toggle('active',!!initial&&tab===initial)});$('adminAddAction').innerHTML='';$('adminContent').innerHTML=manager?'<div class="settings-empty">Selecione uma opção acima para gerenciar os cadastros.</div>':'<div class="documents-loading"><span class="documents-spinner"></span><span>Carregando dados…</span></div>';loadAdmin();}return true}
let editorObserver=null;
function markEditorDirty(){if(state.editorTracking)state.editorDirty=true}
function pauseEditorTracking(){state.editorTracking=false;state.editorDirty=false;if(editorObserver)editorObserver.disconnect()}
function beginEditorTracking(){if(!editorObserver)editorObserver=new MutationObserver(markEditorDirty);editorObserver.disconnect();state.editorDirty=false;state.editorTracking=false;setTimeout(()=>{const root=$('view-editor');if(!root||root.classList.contains('hidden'))return;editorObserver.observe(root,{subtree:true,childList:true,characterData:true});state.editorTracking=true},0)}
function statusTag(v){return '<span class="tag '+esc(String(v).replace(/\s/g,'-'))+'">'+esc(v)+'</span>'}function fmt(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleString('pt-BR')}function fmtDate(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?esc(v):d.toLocaleDateString('pt-BR')}
function table(headers,rows){return '<table class="data"><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>'}
function sortableDocumentTable(headers,rows){return '<table class="data documents-sortable"><thead><tr>'+headers.map((h,i)=>'<th>'+(h?'<button type="button" class="sort-heading document-sort-heading" data-direction="" onclick="sortAdminTable(this,'+i+')">'+esc(h)+'<span class="sort-mark" aria-hidden="true"></span></button>':'')+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>'}
function adminTable(headers,rows){return '<table class="data admin-sortable"><thead><tr>'+headers.map((h,i)=>'<th>'+(h?'<button type="button" class="sort-heading" data-direction="'+(i===0?'asc':'')+'" onclick="sortAdminTable(this,'+i+')">'+esc(h)+'<span class="sort-mark" aria-hidden="true">'+(i===0?'↑':'')+'</span></button>':'')+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>'}
function sortAdminTable(button,column){const table=button.closest('table'),body=table.tBodies[0],rows=[...body.rows],next=button.dataset.direction==='asc'?'desc':'asc';table.querySelectorAll('.sort-heading').forEach(x=>{x.dataset.direction='';const mark=x.querySelector('.sort-mark');if(mark)mark.textContent=''});button.dataset.direction=next;button.querySelector('.sort-mark').textContent=next==='asc'?'↑':'↓';rows.sort((a,b)=>{const ac=a.cells[column],bc=b.cells[column],av=(ac?.dataset.sort||ac?.innerText||'').trim(),bv=(bc?.dataset.sort||bc?.innerText||'').trim();return av.localeCompare(bv,'pt-BR',{sensitivity:'base',numeric:true})*(next==='asc'?1:-1)}).forEach(row=>body.appendChild(row))}
function openModal(html){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden');$('modalBody').innerHTML=''}
function openHelpModal(){openModal('<div class="help-modal"><div class="help-modal-title"><span class="help-modal-icon">?</span><div><h2>Ajuda da plataforma</h2><p>Guia rápido para documentos, aprovações e treinamentos.</p></div></div><div class="help-modal-grid"><section><h3>Fluxo dos documentos</h3><ol><li><strong>Em criação:</strong> elaboração da primeira edição.</li><li><strong>Aguardando aprovação:</strong> análise pelo aprovador do setor.</li><li><strong>Vigente:</strong> documento aprovado e disponível para uso.</li><li><strong>Em revisão:</strong> preparação de uma nova edição.</li><li><strong>Obsoleto:</strong> documento retirado de circulação após aprovação.</li></ol></section><section><h3>Tipos de documento</h3><ul><li><strong>POP:</strong> procedimento operacional padrão.</li><li><strong>IT:</strong> instrução de trabalho.</li><li><strong>POL:</strong> política organizacional.</li><li><strong>FOR:</strong> formulário controlado, sem treinamento nesta versão.</li></ul></section><section><h3>Permissões</h3><ul><li><strong>Manager:</strong> acesso geral à plataforma.</li><li><strong>Aprovador:</strong> aprova documentos dos setores atribuídos.</li><li><strong>Supervisor:</strong> edita documentos e administra treinamentos dos seus setores.</li><li><strong>Responsável:</strong> acompanha documentos e administra treinamentos dos seus setores.</li><li><strong>Visitante:</strong> consulta e imprime, sem realizar alterações.</li></ul></section><section><h3>Treinamentos</h3><ul><li>Apenas a última edição vigente exige treinamento.</li><li>POP e IT geram treinamento ou atualização.</li><li>Políticas geram ciência ou atualização de ciência.</li><li>A eficácia vence em 30 dias e pode ser prorrogada uma vez para 60 dias.</li><li><strong class="help-overdue">Texto vermelho</strong> indica avaliação de eficácia com prazo vencido.</li></ul></section></div><div class="help-modal-footer"><p>Os cards e as pendências da página inicial respeitam os setores e as atribuições do usuário conectado.</p><button type="button" class="btn" data-close-modal>Entendi</button></div></div>')}

document.addEventListener('DOMContentLoaded',()=>{const theme=localStorage.getItem('gd-theme')||'light';document.documentElement.dataset.theme=theme;const toggleTheme=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('gd-theme',n)};$('themeBtn').onclick=toggleTheme;$('loginThemeBtn').onclick=toggleTheme;$('showPass').onclick=()=>$('loginPass').type=$('loginPass').type==='password'?'text':'password';$('loginForm').onsubmit=handleLogin;$('logoutBtn').onclick=handleLogout;document.addEventListener('click',e=>{const view=e.target.closest('[data-view]');if(view){e.preventDefault();showView(view.dataset.view)}if(e.target.closest('[data-close-modal]'))closeModal();const refresh=e.target.closest('[data-refresh]');if(refresh)showView(refresh.dataset.refresh)});$('newDocBtn').onclick=()=>openEditor();$('filterDocsBtn').onclick=loadDocuments;$('filterTrainingBtn').onclick=renderTraining;$('saveDraftBtn').onclick=saveDraft;$('editType').onchange=()=>{updateEditorHeader();renderEditorSections($('editType').value,[]);renderEditorRevisions($('editType').value,null)};document.querySelectorAll('[data-training-view]').forEach(b=>b.onclick=()=>{state.trainingView=b.dataset.trainingView;state.trainingDetail='';document.querySelectorAll('[data-training-view]').forEach(x=>x.classList.toggle('active',x===b));renderTraining()});document.querySelectorAll('[data-admin-tab]').forEach(b=>b.onclick=()=>{state.adminTab=b.dataset.adminTab;document.querySelectorAll('[data-admin-tab]').forEach(x=>x.classList.toggle('active',x===b));renderAdmin()});});

document.addEventListener('DOMContentLoaded',()=>{$('refreshBtn').onclick=refreshCurrentView;});
document.addEventListener('DOMContentLoaded',()=>{$('editSector').onchange=()=>{updateEditorHeader();renderEditorRevisions($('editType').value,state.currentDoc)};});
document.addEventListener('input',event=>{if(event.target.closest('#view-editor'))markEditorDirty()});
document.addEventListener('change',event=>{if(event.target.closest('#view-editor'))markEditorDirty()});
window.addEventListener('beforeunload',event=>{if(!state.editorDirty)return;event.preventDefault();event.returnValue=''});
document.addEventListener('pointerdown',event=>{if(event.target.closest('.editor-object,.image-shape')||event.target.closest('#imageShapeTools'))return;clearObjectSelection()});
async function refreshCurrentView(){const active=document.querySelector('.view:not(.hidden)'),name=active?active.id.replace('view-',''):'dashboard';busy(true);try{if(name==='detail'&&state.currentDoc)await openDetail(state.currentDoc.document.Id);else if(name==='editor')toast('Salve o documento antes de atualizar.');else showView(name);toast('Dados atualizados.');}finally{busy(false)}}
function startSplash(){const splash=$('splash'),wrap=$('splashLogoWrap'),mask=$('splashLogoMask'),dark=$('splashLogoDark'),light=$('splashLogoLight');splash.classList.remove('hidden','hide');wrap.classList.remove('glow');mask.style.animation='none';void mask.offsetWidth;mask.style.animation='';let finish;const done=new Promise(resolve=>finish=resolve),active=()=>document.documentElement.dataset.theme==='light'?light:dark,direct=()=>finish();dark.onerror=direct;light.onerror=direct;mask.addEventListener('animationend',()=>{wrap.classList.add('glow');const target=active();target.addEventListener('animationend',finish,{once:true});setTimeout(finish,1620)},{once:true});return {done,hide:()=>{splash.classList.add('hide');setTimeout(()=>splash.classList.add('hidden'),520)}}}
async function handleLogin(e){e.preventDefault();const err=$('loginError');err.classList.add('hidden');const splash=startSplash();try{const r=await gas('login',$('loginUser').value,$('loginPass').value);state.token=r.token;state.profile=r.profile;const loaded=await Promise.all([gas('getBootstrap',state.token),gas('getDashboard',state.token)]);state.bootstrap=loaded[0];state.dashboard=loaded[1];sessionStorage.setItem('gd-token',state.token);enterApp();await splash.done;splash.hide()}catch(x){splash.hide();fail(x,err)}}
function enterApp(){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('headerHello').textContent='Olá, '+state.profile.name+'!';const sectorNames=state.bootstrap.sectors.map(s=>s.Nome);$('headerSector').textContent=sectorNames.length?'Setor: '+sectorNames.join(', '):'';$('logoutBtn').title='Sair · '+state.profile.name;const manager=state.profile.roles.includes('Manager'),visitor=state.profile.roles.includes('Visitante'),settings=manager||visitor||state.profile.roles.some(r=>r==='Supervisor'||r==='Responsável de setor');document.querySelectorAll('[data-manager]').forEach(x=>x.classList.toggle('hidden',!manager));const settingsButton=document.querySelector('[data-view="users"]');if(settingsButton)settingsButton.classList.toggle('hidden',!settings);document.querySelectorAll('[data-view="training"]').forEach(x=>x.classList.remove('hidden'));$('newDocBtn').classList.toggle('hidden',visitor||!state.profile.roles.some(r=>r==='Manager'||r==='Supervisor'||r==='Aprovador'));fillOptions();showView('dashboard');}
async function handleLogout(){if(!confirmEditorExit())return;busy(true);try{await gas('logout',state.token)}catch(e){}finally{busy(false)}sessionStorage.removeItem('gd-token');state.token='';state.profile=null;state.bootstrap=null;state.dashboard=null;state.currentDoc=null;state.docs=[];state.training=null;state.admin=null;pauseEditorTracking();$('app').classList.add('hidden');$('splash').classList.add('hidden');$('loginView').classList.remove('hidden');$('loginForm').reset();$('loginError').classList.add('hidden');$('loginPass').type='password';document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));$('view-dashboard').classList.remove('hidden');window.scrollTo(0,0);setTimeout(()=>$('loginUser').focus(),0)}
function fillOptions(){const sectors=state.bootstrap.sectors.map(s=>'<option value="'+esc(s.Id)+'">'+esc(s.Nome)+'</option>').join('');$('docSectorFilter').innerHTML='<option value="">Todos os setores</option>'+sectors;$('editSector').innerHTML=sectors;}
async function changePassword(e){e.preventDefault();busy(true);try{await gas('alterarMinhaSenha',state.token,$('currentPassword').value,$('newPassword').value);toast('Senha alterada.');e.target.reset()}catch(x){fail(x)}finally{busy(false)}}

async function loadDashboard(){try{const d=state.dashboard||await gas('getDashboard',state.token);state.dashboard=null;const labels=[['vigentes','Vigentes','vigente'],['revisao','Em revisão','revision'],['aprovacao','Aguardando aprovação','approval'],['treinamentosPendentes','Aguardando treinamento','training']];$('kpiGrid').innerHTML=labels.map(x=>'<button type="button" class="kpi dashboard-kpi" onclick="openDashboardIndicator(\''+x[2]+'\')"><strong>'+Number(d.kpis[x[0]]||0)+'</strong><span>'+x[1]+'</span></button>').join('');renderDashboardPending('revision',d.pending?.revision||[]);renderDashboardPending('approval',d.pending?.approval||[]);renderDashboardPending('training',d.pending?.training||[]);const auditCard=$('dashboardAuditCard');auditCard.classList.toggle('hidden',!d.showAudit);auditCard.open=false;$('recentAudit').innerHTML=(d.audit||[]).length?d.audit.map(a=>'<button type="button" class="activity dashboard-activity" onclick="openDetail(\''+esc(a.documentId)+'\')"><strong>'+esc(a.user)+' - '+esc(a.action)+'</strong><span>'+esc(a.code)+' - '+fmt(a.date)+'</span></button>').join(''):'<p>Nenhuma atividade registrada.</p>';}catch(e){fail(e)}}
function renderDashboardPending(type,rows){const host=$(type+'Pending'),count=$(type+'PendingCount');count.textContent=rows.length;if(!rows.length){host.innerHTML='<div class="dashboard-empty">Nenhuma pendência.</div>';return}host.innerHTML=rows.slice(0,6).map(row=>{if(type==='training')return '<button type="button" class="dashboard-pending-item" onclick="openDashboardTraining(\''+esc(row.documentId)+'\')"><span><strong>'+esc(row.code)+' · '+esc(row.edition)+'</strong><small>'+esc(row.title)+' · '+esc(row.sector)+'</small></span>'+(row.attention?'<span class="dashboard-pending-value">'+Number(row.pending||0)+' pendente'+(Number(row.pending||0)===1?'':'s')+'</span>':'')+'</button>';return '<button type="button" class="dashboard-pending-item" onclick="openDetail(\''+esc(row.id)+'\')"><span><strong>'+esc(row.code)+' · '+esc(row.edition)+'</strong><small>'+esc(row.title)+' · '+esc(row.sector)+'</small></span>'+(type==='approval'&&row.attention?'<span class="dashboard-pending-value">Pendente</span>':'<span class="dashboard-item-arrow" aria-hidden="true">›</span>')+'</button>'}).join('')+(rows.length>6?'<button type="button" class="dashboard-more" onclick="openDashboardIndicator(\''+type+'\')">Ver todas ('+rows.length+')</button>':'')}
function openDashboardIndicator(type){if(type==='training'){state.trainingView='documents';state.trainingDetail='';document.querySelectorAll('[data-training-view]').forEach(x=>x.classList.toggle('active',x.dataset.trainingView==='documents'));$('trainingStatus').value='Pendente';showView('training');return}$('docStatusFilter').value=type==='vigente'?'Vigente':type==='revision'?'Em criação ou revisão':'Aguardando aprovação';showView('documents')}
function openDashboardTraining(documentId){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));$('view-training').classList.remove('hidden');document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('hidden',x.dataset.view==='training'));state.trainingView='documents';state.trainingDetail='';document.querySelectorAll('[data-training-view]').forEach(x=>x.classList.toggle('active',x.dataset.trainingView==='documents'));$('trainingStatus').value='Pendente';loadTraining(documentId)}

function documentViewButton(id){return '<button type="button" class="document-view-btn" onclick="openDetail(\''+esc(id)+'\')" title="Visualizar documento" aria-label="Visualizar documento"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>'}
async function loadDocuments(){const host=$('documentsTable');host.innerHTML='<div class="documents-loading" role="status" aria-live="polite"><span class="documents-spinner" aria-hidden="true"></span><span>Carregando documentos…</span></div>';try{const f={q:$('docSearch').value,tipo:$('docTypeFilter').value,setor:$('docSectorFilter').value,status:$('docStatusFilter').value};state.docs=await gas('listarDocumentos',state.token,f);host.innerHTML=state.docs.length?sortableDocumentTable(['Código','Título','Tipo','Setor','Edição','Status','Responsável','Atualização',''],state.docs.map(d=>'<tr><td>'+esc(d.Codigo)+'</td><td>'+esc(d.Titulo)+'</td><td>'+esc(d.Tipo)+'</td><td>'+esc(d.Setor)+'</td><td>'+esc(d.Edicao)+'</td><td>'+statusTag(d.Status)+'</td><td>'+esc(d.ResponsavelNome)+'</td><td data-sort="'+esc(d.AtualizadoEm)+'">'+fmtDate(d.AtualizadoEm)+'</td><td>'+documentViewButton(d.Id)+'</td></tr>')):'<p>Nenhum documento encontrado.</p>';}catch(e){host.innerHTML='<div class="documents-load-error">Não foi possível carregar os documentos.</div>';fail(e)}}
function documentTypeLabel(type){return {POP:'Procedimento Operacional Padrão',IT:'Instrução de Trabalho',FOR:'Formulário Controlado',POL:'Política'}[type]||type}
function updateEditorHeader(){const type=$('editType').value;$('editDocumentKind').textContent=documentTypeLabel(type);if(!state.currentDoc){const sector=state.bootstrap.sectors.find(s=>String(s.Id)===String($('editSector').value)),sigla=String(sector?.Sigla||sector?.Nome||'XXX').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase()||'XXX';$('editCodePreview').textContent=type+'-'+sigla+'-000'}}
function openEditor(docData){pauseEditorTracking();state.currentDoc=docData||null;showView('editor');$('editType').disabled=!!docData;$('editType').value=docData?docData.document.Tipo:'POP';$('editTitle').value=docData?docData.document.Titulo:'';$('editSector').value=docData?docData.document.SetorId:(state.bootstrap.sectors[0]?.Id||'');$('editResponsible').value=docData?docData.document.ResponsavelId:'';$('editCodePreview').textContent=docData?docData.document.Codigo:'POP-XXX-000';$('editEditionPreview').textContent=docData?docData.document.Edicao:'Ed. 01';updateEditorHeader();renderEditorSections($('editType').value,docData?docData.source.sections:[]);renderEditorRevisions($('editType').value,docData);beginEditorTracking()}
function extractTopicContents(html){const box=document.createElement('div');box.innerHTML=html||'';const topics=[...box.querySelectorAll(':scope > .doc-topic')];if(topics.length)return topics.map(t=>t.querySelector('.topic-content')?.innerHTML||'');return html&&html.trim()?[html]:['']}

function openBatchTrainingModal(){const ids=selectedTrainingParticipants(),parts=ids.map(id=>state.training.participants.find(p=>String(p.Id)===String(id))).filter(Boolean);if(!parts.length)return toast('Selecione ao menos um colaborador.');const pending=parts.every(p=>p.Status==='Pendente'),completed=parts.every(p=>p.Status==='Concluído');if(!pending&&!completed)return toast('Selecione colaboradores que estejam no mesmo status.');if(completed&&parts.some(p=>p.Eficacia==='Não aplicável'))return toast('Um dos treinamentos selecionados não exige avaliação de eficácia.');state.trainingBatchIds=ids;const today=todayLocalIso(),disabled=pending?' disabled':'',trainingDisabled=completed?' disabled':'',canExtend=completed&&parts.every(p=>p.Eficacia==='Pendente'&&!p.PrazoProrrogado&&p.PrazoEficacia),date=commonTrainingValue(parts,'DataTreinamento'),effDate=commonTrainingValue(parts,'DataEficacia'),comment=commonTrainingValue(parts,'Observacao'),efficacy=commonTrainingValue(parts,'Eficacia')||'Pendente';openModal('<div class="batch-modal-title"><h2>Atualizar em lote</h2><p>'+parts.length+' colaboradores selecionados</p></div><div class="efficacy-summary"><span>Prazo da eficácia</span><strong>'+(canExtend?'Elegível para prorrogação':'Conforme cada colaborador')+'</strong>'+(canExtend?'<button type="button" class="btn-grey" onclick="extendBatchFromModal()">Prorrogar para 60 dias</button>':'')+'</div><form id="batchTrainingForm" class="modal-form"><label>Data do treinamento<input id="batchModalTrainingDate" type="date" max="'+today+'" value="'+esc(date)+'"'+trainingDisabled+(pending?' required':'')+'></label><label>Eficácia<select id="batchModalEfficacy" onchange="toggleBatchModalNoteRequired()"'+disabled+'><option>Pendente</option><option>Eficaz</option><option>Não eficaz</option><option>Não aplicável</option></select></label><label>Data da eficácia<input id="batchModalEfficacyDate" type="date" max="'+today+'" value="'+esc(effDate)+'"'+disabled+'></label><label>Comentário<textarea id="batchModalNote"'+disabled+'>'+esc(comment)+'</textarea></label>'+(pending?'<small class="muted">A eficácia ficará disponível depois que os treinamentos forem registrados.</small>':'')+'<button class="btn" type="submit">Salvar</button></form>');$('batchModalEfficacy').value=efficacy;toggleBatchModalNoteRequired();$('batchTrainingForm').onsubmit=e=>saveBatchTrainingModal(e,pending)}
function toggleBatchModalNoteRequired(){const efficacy=$('batchModalEfficacy'),note=$('batchModalNote');if(note)note.required=!!efficacy&&!efficacy.disabled&&efficacy.value==='Não eficaz'}
async function saveBatchTrainingModal(e,pending){e.preventDefault();const ids=state.trainingBatchIds||[];busy(true);try{if(pending)await gas('registrarTreinamento',state.token,{participantIds:ids,date:$('batchModalTrainingDate').value});else await gas('avaliarEficacia',state.token,{participantIds:ids,efficacy:$('batchModalEfficacy').value,date:$('batchModalEfficacyDate').value,note:$('batchModalNote').value});closeModal();toast('Treinamentos atualizados.');await loadTraining()}catch(x){fail(x)}finally{busy(false)}}

function trainingModal(id){const p=state.training.participants.find(x=>String(x.Id)===String(id));if(!p)return;const pending=p.Status!=='Concluído',canExtend=!pending&&p.Eficacia==='Pendente'&&!p.PrazoProrrogado&&p.PrazoEficacia,disabled=pending?' disabled':'',today=todayLocalIso();openModal('<div class="training-modal-head"><div><h2>Atualizar treinamento</h2><p><strong>'+esc(p.Colaborador)+'</strong> · '+esc(p.Tipo||'')+'</p></div><button type="button" class="btn-grey modal-head-action" onclick="openPersonDetails(\''+p.ColaboradorId+'\')">Ver documentos e treinamentos</button></div><div class="efficacy-summary"><span>Prazo da eficácia</span><strong>'+efficacyDeadlineCell(p)+'</strong>'+(canExtend?'<button type="button" class="btn-grey" onclick="extendSingleEfficacy(\''+p.Id+'\')">Prorrogar para 60 dias</button>':'')+'</div><form id="trainingForm" class="modal-form"><label>Data do treinamento<input id="trainingDate" type="date" max="'+today+'" value="'+esc(String(p.DataTreinamento||'').slice(0,10))+'"></label><label>Eficácia<select id="efficacy" onchange="toggleTrainingNoteRequired()"'+disabled+'><option>Pendente</option><option>Eficaz</option><option>Não eficaz</option><option>Não aplicável</option></select></label><label>Data da eficácia<input id="efficacyDate" type="date" max="'+today+'" value="'+esc(String(p.DataEficacia||'').slice(0,10))+'"'+disabled+'></label><label>Comentário<textarea id="efficacyNote"'+disabled+'>'+esc(p.Observacao||'')+'</textarea></label>'+(pending?'<small class="muted">A eficácia ficará disponível depois que o treinamento for registrado.</small>':'')+'<button class="btn" type="submit">Salvar</button></form>');$('efficacy').value=p.Eficacia||'Pendente';toggleTrainingNoteRequired();$('trainingForm').onsubmit=e=>saveTraining(e,id,p)}
async function openTrainingParticipantModal(id){let participant=state.training&&state.training.participants&&state.training.participants.find(p=>String(p.Id)===String(id));if(!participant){busy(true);try{state.training=await gas('listarTreinamentos',state.token);participant=state.training.participants.find(p=>String(p.Id)===String(id))}catch(e){return fail(e)}finally{busy(false)}}if(!participant)return toast('Este treinamento não está disponível na edição vigente.');trainingModal(id)}
function toggleTrainingNoteRequired(){const efficacy=$('efficacy'),note=$('efficacyNote');if(note)note.required=!!efficacy&&!efficacy.disabled&&efficacy.value==='Não eficaz'}
async function extendSingleEfficacy(id){busy(true);try{await gas('prorrogarPrazoEficacia',state.token,{participantIds:[id]});closeModal();toast('Prazo prorrogado para 60 dias.');await loadTraining()}catch(e){fail(e)}finally{busy(false)}}
async function saveTraining(e,id,p){e.preventDefault();busy(true);try{if($('trainingDate').value&&p.Status!=='Concluído')await gas('registrarTreinamento',state.token,{participantIds:[id],date:$('trainingDate').value});const efficacyChanged=$('efficacy').value!==p.Eficacia||$('efficacyDate').value!==String(p.DataEficacia||'').slice(0,10)||$('efficacyNote').value!==String(p.Observacao||'');if(p.Status==='Concluído'&&efficacyChanged)await gas('avaliarEficacia',state.token,{participantIds:[id],efficacy:$('efficacy').value,date:$('efficacyDate').value,note:$('efficacyNote').value});closeModal();toast('Treinamento atualizado.');await loadTraining()}catch(x){fail(x)}finally{busy(false)}}

async function loadAdmin(){const allowed=state.profile.roles.some(r=>r==='Manager'||r==='Supervisor'||r==='Responsável de setor'||r==='Visitante');if(!allowed)return;try{state.admin=await gas('listarAdministracao',state.token);renderAdmin()}catch(e){fail(e)}}
function renderAdmin(){if(!state.admin||!state.adminTab)return;const c=$('adminContent'),a=$('adminAddAction'),visitor=state.admin.restricted==='visitor';if(state.adminTab==='users'){a.innerHTML=visitor?'':'<button class="btn-grey" onclick="openUserForm()">+ Adicionar usuário</button>';c.innerHTML=visitor?visitorUserAdmin():userAdmin()}if(state.adminTab==='sectors'){a.innerHTML='<button class="btn-grey" onclick="openSectorForm()">+ Adicionar setor</button>';c.innerHTML=sectorAdmin()}if(state.adminTab==='people'){a.innerHTML='<button class="btn-grey" onclick="openPersonForm()">+ Adicionar colaborador</button>';c.innerHTML=peopleAdmin()}}
function countBadge(n){return '<span class="count-badge">'+Number(n||0)+'</span>'}
function sortByText(list,key){return [...list].sort((a,b)=>String(a[key]||'').localeCompare(String(b[key]||''),'pt-BR',{sensitivity:'base',numeric:true}))}

function userSectorNames(u){const ids=String(u.Setores||'').split(/[;,]/).filter(Boolean);if(ids.includes('*'))return 'Todos os setores';return ids.map(id=>state.admin.sectors.find(s=>String(s.Id)===String(id))).filter(Boolean).map(s=>s.Nome).join(', ')||'—'}

function userAdmin(){const active=sortByText(state.admin.users.filter(u=>u.Ativo),'Usuario'),inactive=sortByText(state.admin.users.filter(u=>!u.Ativo),'Usuario'),rows=list=>list.map(u=>'<tr data-user-row="'+esc(u.Id)+'"><td>'+esc(u.Usuario)+'</td><td>'+userPasswordCell(u)+'</td><td class="user-role-cell">'+baseRoleTags(u)+'</td><td class="user-password-actions">'+userActionButtons(u.Id)+'</td></tr>');return '<div class="admin-status-grid"><section class="admin-section"><h2>Ativos '+countBadge(active.length)+'</h2><div class="card table-responsive admin-table-card">'+adminTable(['Usuário','Senha','Tipo',''],rows(active))+'</div></section><section class="admin-section admin-inactive"><h2>Inativos '+countBadge(inactive.length)+'</h2><div class="card table-responsive admin-table-card">'+adminTable(['Usuário','Senha','Tipo',''],rows(inactive))+'</div></section></div>'}
function visitorUserAdmin(){const active=sortByText(state.admin.users.filter(u=>u.Ativo),'Usuario'),inactive=sortByText(state.admin.users.filter(u=>!u.Ativo),'Usuario'),rows=list=>list.map(u=>'<tr><td>'+esc(u.Usuario)+'</td><td>'+readonlyRoleTags(u)+'</td><td>'+statusTag(u.Ativo?'Ativo':'Inativo')+'</td></tr>');return '<div class="admin-status-grid"><section class="admin-section"><h2>Ativos '+countBadge(active.length)+'</h2><div class="card table-responsive admin-table-card">'+adminTable(['Usuário','Tipo','Status'],rows(active))+'</div></section><section class="admin-section admin-inactive"><h2>Inativos '+countBadge(inactive.length)+'</h2><div class="card table-responsive admin-table-card">'+adminTable(['Usuário','Tipo','Status'],rows(inactive))+'</div></section></div>'}
function toggleTablePassword(id,button){const input=$('userPass_'+id),show=input.type==='password';input.type=show?'text':'password';button.title=show?'Ocultar senha':'Exibir senha';button.setAttribute('aria-label',button.title)}
function beginUserPasswordEdit(id){document.querySelectorAll('.inline-password input:not([readonly])').forEach(input=>cancelUserPasswordEdit(input.id.replace('userPass_','')));const input=$('userPass_'+id),row=input.closest('tr'),u=state.admin.users.find(x=>String(x.Id)===String(id)),roles=String(u.Papeis||'').split(';'),assigned=roles.some(r=>['Responsável de setor','Supervisor','Aprovador'].includes(r)),manager=roles.includes('Manager'),visitor=roles.includes('Visitante'),roleChoices='<label data-inline-role="Manager"><input type="checkbox" name="inlineRole_'+id+'" value="Manager" '+(manager?'checked':'')+' onchange="updateInlineRoleVisibility(\''+id+'\')"> Manager</label>'+(assigned?'':'<label data-inline-role="Visitante"><input type="checkbox" name="inlineRole_'+id+'" value="Visitante" '+(visitor?'checked':'')+' onchange="updateInlineRoleVisibility(\''+id+'\')"> Visitante</label>');input.readOnly=false;input.type='text';row.querySelector('.user-role-cell').innerHTML='<div class="inline-role-checks">'+roleChoices+'<label class="inline-active-check"><input type="checkbox" id="inlineActive_'+id+'" '+(u.Ativo?'checked':'')+'> Ativo</label></div>';updateInlineRoleVisibility(id);input.focus();input.select();row.querySelector('.user-password-actions').innerHTML='<div class="inline-edit-actions"><button type="button" class="inline-save-btn" onclick="saveInlineUserPassword(\''+id+'\')" title="Salvar alterações" aria-label="Salvar alterações">✓</button><button type="button" class="inline-cancel-btn" onclick="cancelUserPasswordEdit(\''+id+'\')" title="Cancelar" aria-label="Cancelar">×</button></div>'}
function updateInlineRoleVisibility(id){const manager=document.querySelector('[name="inlineRole_'+id+'"][value="Manager"]'),visitor=document.querySelector('[name="inlineRole_'+id+'"][value="Visitante"]');if(manager)manager.closest('label').classList.toggle('hidden',!!visitor&&visitor.checked);if(visitor)visitor.closest('label').classList.toggle('hidden',manager.checked)}

async function saveInlineUserPassword(id){const input=$('userPass_'+id),senha=input.value,roles=[...document.querySelectorAll('[name="inlineRole_'+id+'"]:checked')].map(x=>x.value),active=$('inlineActive_'+id);if(!senha)return toast('Informe a senha.');busy(true);try{await gas('salvarUsuario',state.token,{Id:id,Senha:senha,Papeis:roles,Ativo:active?active.checked:true});toast('Usuário atualizado.');await loadAdmin()}catch(e){fail(e)}finally{busy(false)}}

async function openUserForm(){const roles=['Manager','Visitante'];openModal('<form class="modal-form" onsubmit="saveUser(event)"><h2>Adicionar usuário</h2><input id="admUserId" type="hidden" value=""><label>Usuário<input id="admUser" required></label><label>Senha<div class="password-field"><input id="admPass" type="password" required><button class="password-eye-btn" type="button" onclick="toggleAdminPassword(this)" title="Exibir senha" aria-label="Exibir senha">'+eyeSvg()+'</button></div></label><div><label>Tipo de usuário</label><div class="check-list role-check-list">'+roles.map(r=>'<label><input type="checkbox" name="admRole" value="'+r+'" onchange="exclusiveBaseRole(this)"> '+r+'</label>').join('')+'</div></div><label style="flex-direction:row"><input id="admUserActive" type="checkbox" checked style="width:auto"> Usuário ativo</label><button class="btn">Salvar</button></form>')}

async function saveUser(e){e.preventDefault();const roleInputs=[...document.querySelectorAll('[name=admRole]:checked')],active=$('admUserActive'),p={Id:$('admUserId').value,Usuario:$('admUser').value,Senha:$('admPass').value,Papeis:roleInputs.map(x=>x.value),Ativo:active?active.checked:true};busy(true);try{await gas('salvarUsuario',state.token,p);closeModal();toast('Usuário salvo.');state.bootstrap=await gas('getBootstrap',state.token);loadAdmin()}catch(x){fail(x)}finally{busy(false)}}
function sectorAdmin(){const active=sortByText(state.admin.sectors.filter(s=>s.Ativo),'Nome'),inactive=sortByText(state.admin.sectors.filter(s=>!s.Ativo),'Nome'),rows=list=>list.map(s=>'<tr><td>'+esc(s.Nome)+'</td><td>'+esc(s.ResponsavelNome||'—')+'</td><td>'+esc(s.SupervisorNome||'—')+'</td><td>'+esc(s.AprovadorNome||'—')+'</td><td>'+editIconButton('openSectorForm',s.Id,'Editar setor')+'</td></tr>');return '<div class="admin-status-grid"><section class="admin-section"><h2>Ativos '+countBadge(active.length)+'</h2><div class="card table-responsive admin-table-card">'+adminTable(['Setor','Responsável','Supervisor','Aprovador',''],rows(active))+'</div></section><section class="admin-section admin-inactive"><h2>Inativos '+countBadge(inactive.length)+'</h2><div class="card table-responsive admin-table-card">'+adminTable(['Setor','Responsável','Supervisor','Aprovador',''],rows(inactive))+'</div></section></div>'}
function sectorRoleField(prefix,label,selected){const users=state.admin.users.filter(u=>(u.Ativo&&!String(u.Papeis||'').split(';').includes('Visitante'))||String(u.Id)===String(selected||'')),options='<option value="">Selecione</option>'+users.map(u=>'<option value="'+u.Id+'" '+(String(selected||'')===String(u.Id)?'selected':'')+'>'+esc(u.Usuario||u.Nome)+'</option>').join('')+'<option value="__new__">+ Novo</option>';return '<div class="sector-role-field"><label>'+label+'<select id="'+prefix+'Select" required onchange="toggleNewSectorUser(\''+prefix+'\',\''+label+'\')">'+options+'</select></label></div>'}

function sectorRolePayload(prefix){const input=$(prefix+'Input');return input?{Usuario:input.value}:{Id:$(prefix+'Select').value}}
async function saveSector(e){e.preventDefault();const p={Id:$('admSectorId').value,Nome:$('admSectorName').value,Responsavel:sectorRolePayload('sectorOwner'),Supervisor:sectorRolePayload('sectorSupervisor'),Aprovador:sectorRolePayload('sectorApprover'),Ativo:$('admSectorActive').checked};busy(true);try{await gas('salvarSetor',state.token,p);closeModal();toast('Setor salvo.');state.bootstrap=await gas('getBootstrap',state.token);loadAdmin()}catch(x){fail(x)}finally{busy(false)}}

function peopleAdmin(){const active=sortByText(state.admin.people.filter(p=>p.Ativo),'Nome'),inactive=sortByText(state.admin.people.filter(p=>!p.Ativo),'Nome'),rows=list=>list.map(p=>'<tr><td><button class="person-name-btn" onclick="openPersonDetails(\''+p.Id+'\')">'+esc(p.Nome)+'</button></td><td>'+esc(personSectorNames(p))+'</td><td>'+editIconButton('openPersonForm',p.Id,'Editar colaborador')+'</td></tr>');return '<div class="admin-status-grid"><section class="admin-section"><h2>Ativos '+countBadge(active.length)+'</h2><div class="card table-responsive admin-table-card">'+adminTable(['Nome','Setores',''],rows(active))+'</div></section><section class="admin-section admin-inactive"><h2>Inativos '+countBadge(inactive.length)+'</h2><div class="card table-responsive admin-table-card">'+adminTable(['Nome','Setores',''],rows(inactive))+'</div></section></div>'}

async function editPersonFromDetails(id){closeModal();busy(true);try{if(!state.admin)state.admin=await gas('listarAdministracao',state.token);openPersonForm(id)}catch(e){fail(e)}finally{busy(false)}}

function openPersonForm(id){const p=id?state.admin.people.find(x=>x.Id===id):null,selected=p?String(p.SetorId||'').split(';'):[],sectors=state.admin.sectors.filter(s=>s.Ativo||selected.includes(String(s.Id)));openModal('<form class="modal-form" onsubmit="savePerson(event)"><h2>'+(p?'Editar colaborador':'Adicionar colaborador')+'</h2><input id="admPersonId" type="hidden" value="'+esc(p?.Id||'')+'"><label>Nome<input id="admPersonName" required value="'+esc(p?.Nome||'')+'"></label><div><label>Setores</label><div class="sector-check-grid">'+sectors.map(s=>'<label><input type="checkbox" name="personSector" value="'+s.Id+'" '+(selected.includes(String(s.Id))?'checked':'')+'> '+esc(s.Nome)+'</label>').join('')+'</div></div><label style="flex-direction:row"><input id="admPersonActive" type="checkbox" '+(!p||p.Ativo?'checked':'')+' style="width:auto"> Colaborador ativo</label><button class="btn">Salvar</button></form>')}
async function savePerson(e){e.preventDefault();const sectors=[...document.querySelectorAll('[name=personSector]:checked')].map(x=>x.value);busy(true);try{await gas('salvarColaborador',state.token,{Id:$('admPersonId').value,Nome:$('admPersonName').value,Setores:sectors,Ativo:$('admPersonActive').checked});closeModal();toast('Colaborador salvo.');loadAdmin()}catch(x){fail(x)}finally{busy(false)}}
</script>
